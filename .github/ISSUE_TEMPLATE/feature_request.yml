name: Feature request
description: Propose a capability aligned with the Core OSS Alpha path
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the impact on `.insight` readability, validation, traceability, or LLM access efficiency.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Public interface and compatibility impact
      description: Note any impact on the package, schema, CLI JSON, MCP, Skill, or conformance.
  - type: textarea
    id: evidence
    attributes:
      label: General acceptance material
      description: Describe a public, sanitized, domain-independent way to verify the capability.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I understand that visual applications, hosted collaboration, enterprise permissions, and a formal v0.2 schema are outside the current Core OSS Alpha path.
          required: true
