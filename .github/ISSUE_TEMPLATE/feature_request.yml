name: 功能建议
description: 提议与 Core OSS Alpha 路线一致的能力
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明对 `.insight` 可读、可验、可追溯或 LLM 访问效率的影响。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: 公开接口与兼容性影响
      description: 是否影响 package、schema、CLI JSON、MCP、Skill 或 conformance。
  - type: textarea
    id: evidence
    attributes:
      label: 通用验收材料
      description: 请提供可公开、脱敏且不依赖单一行业的验收思路。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我理解 Reader / Studio、Hub、企业权限和正式 v0.2 不是当前 Core OSS Alpha 主线。
          required: true
