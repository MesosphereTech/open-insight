name: Bug report
description: Report a publicly reproducible Open Insight Core issue
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not upload customer files, personal data, API keys, `.env` content, local absolute paths, or unsanitized logs. Report security vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse HEAD or CLI --version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Compiler / Parser, Validator / Conformance, CLI / MCP, Skill, SDK / Runtime, Package / Schema, Proof / Benchmark, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use a public fixture or a small, sanitized sample that you are allowed to share.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: dropdown
    id: source_mode
    attributes:
      label: Source mode
      options: [source_bundled, source_light, Not applicable, Unsure]
  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I removed credentials, personal data, customer material, and local absolute paths.
          required: true
        - label: I confirm that this is not a security vulnerability requiring private disclosure.
          required: true
